[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = ["--reuse-db", "-q", "--nomigrations"]

[tool.djlint]
profile = "django"
extension = "html"
indent = 2
max_line_length = 120
ignore = "H006,H030,H031"
exclude = ".venv,venv,staticfiles,static"


[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "apps"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
